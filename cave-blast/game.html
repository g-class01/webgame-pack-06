				left:30%;

			}
			
			#scene #bullet {
				position:fixed;
				top:-100px;
				left:-100px;	
				
				z-index:50;
			}	

			#scene #hit {
				position:fixed;
				top:-100px;
				left:-100px;	
				
				z-index:50;
				transform: scale(0.1);
			}
			
			#scene #enemy {
				position:fixed;
				top:35%;
				right:30%;
				-webkit-animation:bounce 1s infinite;
			}
			
			
			@-webkit-keyframes bounce {
			  0%       { margin-top:0; }
			  50%      { margin-top:20px; }
			  100%     {margin-top:0;}
			}

				position:fixed;
				top:50%;
				left:0;
				right:0;
				
				width:50%;				
				margin:0 auto;
				padding:4px 6px;
				height: 50px;
				
				border-radius: 20px;
				
				background:#5a3a32;
				z-index:-9999;
			}
			
			#fill {
				position:relative;
				width:5%;
				background-color:#ffffff;
				height:50px;
				margin:0px;
				
				border-radius: 15px;				
				
				background: linear-gradient(

			}

				font-weight:bold;
				text-shadow: 1px 1px 2px black;

		var fails		= 0;
		
		
		function poki_log(t) {
			console.log(t);
		}
            
        function poki_debug() {
            return pokiDebug;
        }
		
		function poki_loading(progress) {
			loading_update(progress);
		}

		window.onload = function() {
			sdk.init().then(() => {
                setTimeout(GameMaker_Init, 1);
                sdk.setDebug(pokiDebug);   
				sdk.gameLoadingStart();	                
			}).catch(e => {
                console.log("ERROR:" + e.message);
                GameMaker_Init();
			});
            
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
			
            canvas.addEventListener('click', function(){
                window.focus();
            });               
		}
		
		window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });
		window.addEventListener('keydown', ev => {
			if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
				ev.preventDefault();
			}
		});
